<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gatefield - Yardley, Pennsylvania</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
 :root {
 --parchment: #FAF7F0;
 --aged-paper: #F5EDE0;
 --gatefield-green: #1C2B22;
 --pine: #2F4A3A;
 --brass: #B08D3F;
 --deep-brass: #8A6A2E;
 --brass-tint: #C9B789;
 --ink: #1A1A1A;
 --muted: #5C5852;
 }

 * { margin: 0; padding: 0; box-sizing: border-box; }

 html, body { height: 100%; }

 body {
 background: var(--parchment);
 color: var(--ink);
 font-family: 'Inter', sans-serif;
 font-weight: 400;
 line-height: 1.6;
 -webkit-font-smoothing: antialiased;
 overflow-x: hidden;
 }

 .page {
 min-height: 100vh;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 padding: 4rem 2rem;
 position: relative;
 }

 /* Subtle background hint of the spring photo, very faint */
 .page::before {
 content: '';
 position: fixed;
 inset: 0;
 background-image: url('neighborhood-spring.jpg');
 background-size: cover;
 background-position: center;
 opacity: 0.06;
 z-index: -1;
 filter: saturate(1.1);
 }

 .mark {
 text-align: center;
 margin-bottom: 5rem;
 opacity: 0;
 animation: rise 1.2s ease 0.2s forwards;
 }

 .eyebrow {
 font-family: 'Inter', sans-serif;
 font-size: 0.68rem;
 font-weight: 500;
 letter-spacing: 0.32em;
 text-transform: uppercase;
 color: var(--deep-brass);
 margin-bottom: 1.25rem;
 }

 .wordmark {
 font-family: 'Cinzel', serif;
 font-weight: 600;
 font-size: clamp(2.75rem, 7vw, 5rem);
 letter-spacing: 0.1em;
 color: var(--gatefield-green);
 line-height: 1;
 }

 .rule {
 width: 60px;
 height: 1px;
 background: var(--brass);
 margin: 1.5rem auto 0.4rem;
 position: relative;
 }
 .rule::after {
 content: '';
 position: absolute;
 top: 4px;
 left: 0; right: 0;
 height: 1px;
 background: var(--brass);
 }

 .place {
 font-family: 'Cormorant Garamond', serif;
 font-style: italic;
 font-size: 1.05rem;
 color: var(--muted);
 margin-top: 1.25rem;
 letter-spacing: 0.02em;
 }

 /* Two doors */
 .doors {
 display: grid;
 grid-template-columns: 1fr auto 1fr;
 gap: 0;
 max-width: 720px;
 width: 100%;
 align-items: center;
 }

 @media (max-width: 640px) {
 .doors {
 grid-template-columns: 1fr;
 gap: 2rem;
 max-width: 320px;
 }
 .divider { display: none; }
 }

 .door {
 text-align: center;
 padding: 2.5rem 1.5rem;
 text-decoration: none;
 color: var(--gatefield-green);
 transition: all 0.4s ease;
 border: 1px solid transparent;
 opacity: 0;
 animation: rise 1.2s ease 0.6s forwards;
 cursor: pointer;
 }

 .door:nth-child(3) {
 animation-delay: 0.8s;
 }

 .door:hover {
 border-color: var(--brass-tint);
 background: rgba(245, 237, 224, 0.5);
 }

 .door-num {
 font-family: 'Cinzel', serif;
 font-size: 0.7rem;
 letter-spacing: 0.3em;
 color: var(--deep-brass);
 margin-bottom: 1.5rem;
 }

 .door-title {
 font-family: 'Cormorant Garamond', serif;
 font-weight: 500;
 font-size: 2rem;
 color: var(--gatefield-green);
 margin-bottom: 0.5rem;
 letter-spacing: 0.01em;
 }

 .door-sub {
 font-family: 'Cormorant Garamond', serif;
 font-style: italic;
 font-size: 1rem;
 color: var(--muted);
 line-height: 1.5;
 }

 .door-arrow {
 font-family: 'Cinzel', serif;
 font-size: 0.7rem;
 letter-spacing: 0.25em;
 color: var(--brass);
 margin-top: 2rem;
 text-transform: uppercase;
 transition: letter-spacing 0.3s ease;
 }

 .door:hover .door-arrow {
 letter-spacing: 0.4em;
 color: var(--deep-brass);
 }

 .divider {
 width: 1px;
 height: 140px;
 background: var(--brass-tint);
 opacity: 0.6;
 }

 footer {
 position: absolute;
 bottom: 2rem;
 left: 0;
 right: 0;
 text-align: center;
 font-family: 'Inter', sans-serif;
 font-size: 0.7rem;
 letter-spacing: 0.15em;
 color: var(--muted);
 text-transform: uppercase;
 opacity: 0;
 animation: fade-only 1.2s ease 1.4s forwards;
 }

 @keyframes rise {
 from { opacity: 0; transform: translateY(20px); }
 to { opacity: 1; transform: translateY(0); }
 }

 @keyframes fade-only {
 from { opacity: 0; }
 to { opacity: 0.7; }
 }
</style>
</head>
<body>

<div class="page">

 <div class="mark">
 <div class="eyebrow">Est. Lower Makefield, Pennsylvania</div>
 <div class="wordmark">GATEFIELD</div>
 <div class="rule"></div>
 <div class="place">A neighborhood of twenty-two homes.</div>
 </div>

 <div class="doors">

 <a href="homeowner.html" class="door">
 <div class="door-num">- I -</div>
 <div class="door-title">Homeowner</div>
 <div class="door-sub">For current residents of Gatefield.<br>Password required.</div>
 <div class="door-arrow">Enter →</div>
 </a>

 <div class="divider"></div>

 <a href="visitor.html" class="door">
 <div class="door-num">- II -</div>
 <div class="door-title">Visitor</div>
 <div class="door-sub">For neighbors, prospective residents,<br>and realtors.</div>
 <div class="door-arrow">Enter →</div>
 </a>

 </div>

 <footer>© 2026 Gatefield Homeowners Association</footer>

</div>

</body>
</html>
