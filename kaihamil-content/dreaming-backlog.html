        // State management
        let currentFilter = 'all';
        let reviewedItems = new Set();
        let itemStatuses = {}; // id -> 'relevant' | 'delete' | 'reprioritize'

        // Load data from localStorage if available
        function loadSavedState() {
            const saved = localStorage.getItem('dreamingBacklogState');
            if (saved) {
                const state = JSON.parse(saved);
                reviewedItems = new Set(state.reviewed || []);
                itemStatuses = state.statuses || {};
            }
        }

        // Save state to localStorage
        function saveState() {
            const state = {
                reviewed: Array.from(reviewedItems),
                statuses: itemStatuses,
                lastSaved: new Date().toISOString()
            };
            localStorage.setItem('dreamingBacklogState', JSON.stringify(state));
            updateChangesText();
        }

        function updateChangesText() {
            const count = Object.keys(itemStatuses).length;
            document.getElementById('changes-text').textContent = 
                count === 0 ? 'No changes' : `${count} item${count !== 1 ? 's' : ''} marked`;
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) return `${diffDays} days ago`;
            if (diffDays < 30) return `${Math.floor(diffDays / 7)} weeks ago`;
            return `${Math.floor(diffDays / 30)} months ago`;
        }

        function getItemClass(item) {
            const daysSince = Math.floor((new Date() - new Date(item.date)) / (1000 * 60 * 60 * 24));
            if (daysSince > 21) return 'stale';
            if (daysSince < 7) return 'recent';
            return '';
        }

        function renderBacklog() {
            const container = document.getElementById('backlog-content');
            
            // Filter themes
            let filtered = dreamingData.themes;
            
            if (currentFilter === 'stale') {
                filtered = filtered.filter(t => {
                    const days = Math.floor((new Date() - new Date(t.date)) / (1000 * 60 * 60 * 24));
                    return days > 21;
                });
            } else if (currentFilter === 'recent') {
                filtered = filtered.filter(t => {
                    const days = Math.floor((new Date() - new Date(t.date)) / (1000 * 60 * 60 * 24));
                    return days < 7;
                });
            } else if (currentFilter === 'daily-improvement') {
                filtered = filtered.filter(t => 
                    t.category.toLowerCase().includes('daily') || 
                    t.category.toLowerCase().includes('improvement')
                );
            } else if (currentFilter === 'systems') {
                filtered = filtered.filter(t => 
                    t.category.toLowerCase().includes('system') ||
                    t.category.toLowerCase().includes('morning') ||
                    t.category.toLowerCase().includes('workflow')
                );
            } else if (currentFilter === 'content') {
                filtered = filtered.filter(t => 
                    t.category.toLowerCase().includes('video') ||
                    t.category.toLowerCase().includes('content')
                );
            }

            // Sort by date (newest first)
            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>No items match the current filter.</p>
                    </div>
                `;
                return;
            }

            // Group by month
            const grouped = filtered.reduce((acc, item) => {
                const month = item.date.substring(0, 7);
                if (!acc[month]) acc[month] = [];
                acc[month].push(item);
                return acc;
            }, {});

            let html = '';
            for (const [month, items] of Object.entries(grouped)) {
                const [year, mon] = month.split('-');
                const monthName = new Date(year, mon - 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                
                html += `
                    <div class="backlog-section">
                        <div class="section-header">
                            <h2 class="section-title">${monthName}</h2>
                            <span class="section-count">${items.length} items</span>
                        </div>
                `;

                for (const item of items) {
                    const itemClass = getItemClass(item);
                    const status = itemStatuses[item.id];
                    const isReviewed = reviewedItems.has(item.id);
                    
                    html += `
                        <div class="backlog-item ${itemClass}" data-id="${item.id}">
                            <div class="item-header">
                                <span class="item-category">${escapeHtml(item.category)}</span>
                                <span class="item-date">${formatDate(item.date)} (${item.date})</span>
                            </div>
                            <div class="item-content">${escapeHtml(item.content)}</div>
                            <div class="item-actions">
                                <button class="action-btn relevant ${status === 'relevant' ? 'selected' : ''}" 
                                        onclick="markItem('${item.id}', 'relevant')">
                                    ${status === 'relevant' ? '✓ ' : ''}Still Relevant
                                </button>
                                <button class="action-btn reprioritize ${status === 'reprioritize' ? 'selected' : ''}" 
                                        onclick="markItem('${item.id}', 'reprioritize')">
                                    ${status === 'reprioritize' ? '✓ ' : ''}Reprioritize
                                </button>
                                <button class="action-btn delete ${status === 'delete' ? 'selected' : ''}" 
                                        onclick="markItem('${item.id}', 'delete')">
                                    ${status === 'delete' ? '✓ ' : ''}OK to Delete
                                </button>
                            </div>
                        </div>
                    `;
                }

                html += '</div>';
            }

            container.innerHTML = html;
            updateStats();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function markItem(id, status) {
            // Toggle if already selected
            if (itemStatuses[id] === status) {
                delete itemStatuses[id];
                reviewedItems.delete(id);
            } else {
                itemStatuses[id] = status;
                reviewedItems.add(id);
            }
            
            saveState();
            renderBacklog();
        }

        function updateStats() {
            const total = dreamingData.themes.length;
            const stale = dreamingData.themes.filter(t => {
                const days = Math.floor((new Date() - new Date(t.date)) / (1000 * 60 * 60 * 24));
                return days > 21;
            }).length;
            const reviewed = reviewedItems.size;
            const pending = total - reviewed;

            document.getElementById('total-themes').textContent = total.toLocaleString();
            document.getElementById('stale-count').textContent = stale.toLocaleString();
            document.getElementById('reviewed-count').textContent = reviewed.toLocaleString();
            document.getElementById('pending-count').textContent = pending.toLocaleString();
        }

        function saveChanges() {
            // In a real implementation, this would POST to a server
            // For now, we just save to localStorage and provide download
            const changes = {
                timestamp: new Date().toISOString(),
                reviewed: Array.from(reviewedItems),
                statuses: itemStatuses
            };
            
            const blob = new Blob([JSON.stringify(changes, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `dreaming-backlog-review-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            alert('Review saved! Changes downloaded as JSON.');
        }

        // Filter button handlers
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderBacklog();
            });
        });

        // Initialize
        loadSavedState();
        
        // Note: In the generated version, dreamingData will be embedded directly
        // For now, show a message about how to populate it
        renderBacklog();
        updateStats();
    </script>
