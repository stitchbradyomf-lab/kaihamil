[build]
  publish = "."
  command = "npm install @netlify/functions @netlify/blobs stripe"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[[edge_functions]]
  path = "/*"
  function = "router"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

# Identity configuration
[context.production.environment]
  NETLIFY_IDENTITY_URL = "https://kaihamil.com/.netlify/identity"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Never serve private data publicly. These sit first so they win over
# every other rule, and force = true so they apply even though the files
# exist in the publish directory. Netlify functions still read them from disk.
[[redirects]]
  from = "/data/allowlist.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/dreaming-backlog.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/dreaming-backlog"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/products/vale-os/verticals/*"
  to = "/404.html"
  status = 404
  force = true

# Groove Pal domain routing
[[redirects]]
  from = "/"
  to = "/products/groove-pal/index.html"
  status = 200
  force = true
  conditions = {Host = ["groovepal.com", "www.groovepal.com"]}

[[redirects]]
  from = "/*"
  to = "/products/groove-pal/:splat"
  status = 200
  force = true
  conditions = {Host = ["groovepal.com", "www.groovepal.com"]}

# Valé subdomain - specific pages first
[[redirects]]
  from = "/setup"
  to = "/vale/setup.html"
  status = 200
  force = true
  conditions = {Host = ["vale.kaihamil.com"]}

[[redirects]]
  from = "/capabilities"
  to = "/vale/capabilities.html"
  status = 200
  force = true
  conditions = {Host = ["vale.kaihamil.com"]}

[[redirects]]
  from = "/thank-you"
  to = "/vale/thank-you.html"
  status = 200
  force = true
  conditions = {Host = ["vale.kaihamil.com"]}

# Valé subdomain - root goes to index
[[redirects]]
  from = "/"
  to = "/vale/index.html"
  status = 200
  force = true
  conditions = {Host = ["vale.kaihamil.com"]}

# Valé subdomain - catch-all for any other paths
[[redirects]]
  from = "/*"
  to = "/vale/:splat"
  status = 200
  force = true
  conditions = {Host = ["vale.kaihamil.com"]}

# Apps subdomain - storefront root
[[redirects]]
  from = "/"
  to = "/apps/index.html"
  status = 200
  force = true
  conditions = {Host = ["apps.kaihamil.com"]}

[[redirects]]
  from = "/index.html"
  to = "/apps/index.html"
  status = 200
  force = true
  conditions = {Host = ["apps.kaihamil.com"]}

# Redirects for protected routes
# force = true is required: without it Netlify serves the existing files
# under /private/ to anyone and never reaches these rules.
[[redirects]]
  from = "/private/*"
  to = "/private/:splat"
  status = 200
  force = true
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/private/*"
  to = "/login.html"
  status = 302
  force = true
