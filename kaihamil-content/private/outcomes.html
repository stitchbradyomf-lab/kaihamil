<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Outcomes | Private Kai Hamil</title>
  <style>
    :root { --ink:#31251d; --muted:#75675d; --paper:#f7f2eb; --card:#fffdfa; --line:#e4d9cc; --gold:#aa7b29; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 system-ui,-apple-system,sans-serif; }
    main { width:min(1500px,100%); margin:auto; padding:32px 22px 60px; }
    header { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:28px; }
    h1 { margin:0; font:500 clamp(30px,5vw,48px)/1.1 Georgia,serif; }
    .sub { color:var(--muted); margin-top:8px; }
    .board { display:grid; grid-template-columns:repeat(5,minmax(230px,1fr)); gap:14px; overflow-x:auto; padding-bottom:12px; }
    .column { min-width:230px; }
    .column-title { display:flex; justify-content:space-between; padding:0 4px 10px; font-weight:700; }
    .count { color:var(--muted); font-weight:500; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:10px; box-shadow:0 3px 14px #5b40240b; }
    .area { color:var(--gold); font-size:12px; font-weight:750; letter-spacing:.07em; text-transform:uppercase; }
    h2 { font-size:16px; line-height:1.35; margin:7px 0 10px; }
    .label { color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    .done { font-size:13px; margin-top:3px; }
    .meta { display:flex; gap:7px; flex-wrap:wrap; margin-top:13px; }
    .pill { background:#f1e9df; border-radius:999px; padding:3px 8px; font-size:11px; }
    .blocked { border-left:4px solid #b44539; }
    .empty { color:var(--muted); border:1px dashed var(--line); border-radius:14px; padding:16px; }
    .error { padding:20px; background:#fff0ee; border:1px solid #e0aaa3; border-radius:12px; }
    @media (max-width:700px) { main{padding:24px 15px}.board{display:flex}.column{width:82vw;flex:none} header{align-items:start;flex-direction:column} }
  </style>
</head>
<body>
<main>
  <header><div><h1>Outcome Board</h1><div class="sub">The changes we are working to make true.</div></div><div class="sub" id="updated"></div></header>
  <section class="board" id="board" aria-live="polite"></section>
</main>
<script>
const states=['To Do','In Progress','Pended','Blocked','Complete'];
function csv(text){let rows=[],row=[],cell='',quote=false;for(let i=0;i<text.length;i++){let c=text[i],n=text[i+1];if(c==='"'&&quote&&n==='"'){cell+='"';i++;}else if(c==='"'){quote=!quote;}else if(c===','&&!quote){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(Boolean))rows.push(row);row=[];cell='';}else cell+=c;}if(cell||row.length){row.push(cell);rows.push(row)}let keys=rows.shift();return rows.map(r=>Object.fromEntries(keys.map((k,i)=>[k,r[i]||''])))}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
fetch('data/outcomes.csv',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(text=>{
  const rows=csv(text); const board=document.querySelector('#board');
  states.forEach(state=>{const items=rows.filter(r=>r.status===state&&!(state==='To Do'&&r.lane==='Backlog')).sort((a,b)=>b.last_active.localeCompare(a.last_active));const col=document.createElement('div');col.className='column';col.innerHTML=`<div class="column-title"><span>${esc(state)}</span><span class="count">${items.length}</span></div>`+(items.length?items.map(r=>`<article class="card ${state==='Blocked'?'blocked':''}"><div class="area">${esc(r.area)}</div><h2>${esc(r.outcome)}</h2><div class="label">Definition of done</div><div class="done">${esc(r.definition_of_done)}</div><div class="meta"><span class="pill">${esc(r.priority)}</span><span class="pill">Active ${esc(r.last_active)}</span>${r.blocked_by?`<span class="pill">Waiting: ${esc(r.blocked_by)}</span>`:''}</div></article>`).join(''):'<div class="empty">No outcomes</div>');board.appendChild(col)});
  const backlog=rows.filter(r=>r.status==='To Do'&&r.lane==='Backlog');if(backlog.length){const col=document.createElement('div');col.className='column';col.innerHTML=`<div class="column-title"><span>Backlog</span><span class="count">${backlog.length}</span></div>`+backlog.map(r=>`<article class="card"><div class="area">${esc(r.area)}</div><h2>${esc(r.outcome)}</h2><div class="label">Definition of done</div><div class="done">${esc(r.definition_of_done)}</div></article>`).join('');board.appendChild(col)}
  document.querySelector('#updated').textContent='Source updated '+(rows.map(r=>r.last_active).sort().pop()||'');
}).catch(()=>document.querySelector('#board').innerHTML='<div class="error">The outcome data could not be loaded.</div>');
</script>
</body>
</html>
