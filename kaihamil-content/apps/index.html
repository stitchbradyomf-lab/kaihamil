<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kai Hamil Applications</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #eef4f0;
            --bg-deep: #dce8df;
            --card: rgba(255, 255, 255, 0.82);
            --card-strong: #f8fbf8;
            --line: rgba(22, 56, 49, 0.14);
            --ink: #17332f;
            --muted: #5d716b;
            --lake: #2d6f73;
            --moss: #5f7f4b;
            --hydrangea: #738db7;
            --thermal: #bf7540;
            --sand: #ddd5c8;
            --shadow: 0 24px 60px rgba(23, 51, 47, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(115, 141, 183, 0.18), transparent 28%),
                radial-gradient(circle at top right, rgba(95, 127, 75, 0.18), transparent 24%),
                linear-gradient(180deg, #f6faf7 0%, var(--bg) 48%, var(--bg-deep) 100%);
            min-height: 100vh;
        }

        a { color: inherit; text-decoration: none; }

        .shell {
            max-width: 1240px;
            margin: 0 auto;
            padding: 28px 24px 88px;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            margin-bottom: 52px;
        }

        .brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            letter-spacing: 0.03em;
        }

        .brand span { color: var(--lake); }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-link {
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.5);
            font-size: 0.92rem;
            color: var(--muted);
        }

        .nav-link.active {
            color: white;
            background: linear-gradient(135deg, var(--lake), #245960);
            border-color: transparent;
        }

        /* Page header */
        .page-head {
            margin-bottom: 48px;
        }

        .page-head h1 {
            margin: 0 0 6px;
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.6rem, 6vw, 4.4rem);
            line-height: 1;
            font-weight: 500;
            letter-spacing: -0.03em;
        }

        .page-head p {
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
        }

        /* Category sections */
        .section {
            margin-bottom: 52px;
        }

        .section-head {
            display: flex;
            align-items: baseline;
            gap: 14px;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--line);
        }

        .section-title {
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.7rem;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        .section-count {
            font-size: 0.82rem;
            color: var(--muted);
            letter-spacing: 0.08em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        /* Cards */
        .card {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 22px;
            border-radius: 22px;
            border: 1px solid var(--line);
            background: var(--card);
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 32px 72px rgba(23, 51, 47, 0.15);
        }

        .card-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .card-body {
            color: var(--muted);
            line-height: 1.62;
            font-size: 0.93rem;
            flex: 1;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .tag {
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(22, 56, 49, 0.09);
            color: var(--muted);
            font-size: 0.78rem;
        }

        .card-actions {
            margin-top: auto;
        }

        .card-link {
            font-weight: 600;
            font-size: 0.93rem;
            color: var(--lake);
        }

        .card-link::after {
            content: ' →';
        }

        .empty {
            padding: 28px;
            border-radius: 22px;
            border: 1px dashed var(--line);
            color: var(--muted);
            background: rgba(255, 255, 255, 0.45);
            font-size: 0.93rem;
        }

        /* Category color accents */
        #lifestyle .section-head { border-left: 3px solid #5f7f4b; padding-left: 14px; }
        #lifestyle .section-title { color: #5f7f4b; }

        #systems .section-head { border-left: 3px solid #1B4D4A; padding-left: 14px; }
        #systems .section-title { color: #1B4D4A; }

        #trips .section-head { border-left: 3px solid #bf7540; padding-left: 14px; }
        #trips .section-title { color: #bf7540; }

        #utilities .section-head { border-left: 3px solid #4a5568; padding-left: 14px; }
        #utilities .section-title { color: #4a5568; }

        .footer {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.88rem;
        }

        @media (max-width: 640px) {
            .shell { padding: 20px 18px 64px; }
            .nav { margin-bottom: 34px; }
            .page-head { margin-bottom: 36px; }
            .card { padding: 18px; border-radius: 18px; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="nav">
            <a class="brand" href="/">kai <span>hamil</span></a>
            <nav class="nav-links">
                <a class="nav-link" href="https://content.kaihamil.com/">Content</a>
                <a class="nav-link" href="/trips/">Trips</a>
                <a class="nav-link active" href="/">Applications</a>
            </nav>
        </header>

        <div class="page-head">
            <h1>Applications</h1>
            <p>Things you open and use.</p>
        </div>

        <section class="section" id="lifestyle">
            <div class="section-head">
                <h2 class="section-title">Lifestyle</h2>
                <span class="section-count" id="lifestyle-count"></span>
            </div>
            <div id="lifestyle-grid" class="grid">
                <div class="empty">Loading...</div>
            </div>
        </section>

        <section class="section" id="systems">
            <div class="section-head">
                <h2 class="section-title">Systems</h2>
                <span class="section-count" id="systems-count"></span>
            </div>
            <div id="systems-grid" class="grid">
                <div class="empty">Loading...</div>
            </div>
        </section>

        <section class="section" id="trips">
            <div class="section-head">
                <h2 class="section-title">Trips</h2>
                <span class="section-count" id="trips-count"></span>
            </div>
            <div id="trips-grid" class="grid">
                <div class="empty">Loading...</div>
            </div>
        </section>

        <section class="section" id="utilities">
            <div class="section-head">
                <h2 class="section-title">Utilities</h2>
                <span class="section-count" id="utilities-count"></span>
            </div>
            <div id="utilities-grid" class="grid">
                <div class="empty">Loading...</div>
            </div>
        </section>

        <footer class="footer">
            kai hamil applications
        </footer>
    </div>

    <script>
        const CATEGORIES = [
            {
                id: 'lifestyle',
                label: 'Lifestyle',
                ids: ['time-focus-app', 'gatefield-hoa', 'whos-making-dinner', 'groove-pal', 'whisky-cellar']
            },
            {
                id: 'systems',
                label: 'Systems',
                ids: ['vale-os', 'vale-pro', 'couples-vale']
            },
            {
                id: 'trips',
                label: 'Trips',
                ids: ['azores-15-year-app', 'dude-trip-26']
            },
            {
                id: 'utilities',
                label: 'Utilities',
                ids: ['daily-brief', 'script-reader', 'control-chart-evaluator', 'photo-flow']
            }
        ];

        const APP_COPY = {
            'time-focus-app': 'An operating tool for managing where attention goes over time.',
            'control-chart-evaluator': 'Evaluate process signals and variation without leaving the browser.',
            'script-reader': 'A stripped-back teleprompter surface for recording and rehearsal.',
            'whos-making-dinner': 'A household dinner planner that turns the 5 PM question into a calmer execution plan.',
            'vale-os': 'Strategic navigation software for goals, decisions, and life systems.',
            'vale-pro': 'A professional-facing Valé surface for work and client operations.',
            'couples-vale': 'A shared operating system for relationships, family coordination, and alignment.',
            'daily-brief': 'A daily briefing surface that packages the day into one launchable dashboard.',
            'groove-pal': 'A music-centered consumer app built on vinyl, trust, and analog patience.',
            'whisky-cellar': 'A private collection app for bottles, tasting notes, and cellar memory.',
            'gatefield-hoa': 'A purpose-built neighborhood operations and communication surface.',
            'photo-flow': 'A workflow app for reviewing, classifying, and organizing visual media.',
            'azores-15-year-app': 'A trip execution app that turns travel planning into a day-of operational surface.',
            'dude-trip-26': 'A packaged group trip application rather than a simple itinerary page.'
        };

        const TAG_LABELS = {
            'trip-app': 'Trip app',
            'travel': 'Travel',
            'assistant': 'Assistant',
            'dashboard': 'Dashboard',
            'workflow': 'Workflow',
            'utility': 'Utility',
            'consumer': 'Consumer',
            'family': 'Family',
            'dinner': 'Dinner',
            'meal-planning': 'Meal planning',
            'household': 'Household',
            'operations': 'Ops',
            'video': 'Video',
            'collection': 'Collection',
            'media': 'Media',
            'work': 'Work',
            'daily': 'Daily',
            'music': 'Music',
            'community': 'Community',
            'hoa': 'HOA',
            'relationship': 'Relationship',
            'attention': 'Attention',
            'time': 'Time',
            'os': 'OS',
            'professional': 'Pro',
            'personal': 'Personal',
            'briefing': 'Briefing',
            'teleprompter': 'Teleprompter',
            'photo': 'Photo',
            'statistics': 'Stats',
            'group': 'Group',
            'brand': 'Brand',
            'azores': 'Azores'
        };

        function esc(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function cardMarkup(app) {
            const href = app.launch_url || app.url;
            const desc = APP_COPY[app.id] || app.description || '';
            const tags = (app.tags || [])
                .filter(t => !['index', 'legacy', 'transitional', 'azores'].includes(t))
                .slice(0, 3)
                .map(t => `<span class="tag">${esc(TAG_LABELS[t] || t)}</span>`)
                .join('');

            return `
                <article class="card">
                    <h3 class="card-title">${esc(app.title)}</h3>
                    <div class="card-body">${esc(desc)}</div>
                    ${tags ? `<div class="meta">${tags}</div>` : ''}
                    <div class="card-actions">
                        <a class="card-link" href="${esc(href)}">Open</a>
                    </div>
                </article>
            `;
        }

        function renderCategory(cat, appsById) {
            const apps = cat.ids
                .map(id => appsById[id])
                .filter(Boolean);

            const countEl = document.getElementById(`${cat.id}-count`);
            const gridEl = document.getElementById(`${cat.id}-grid`);

            if (countEl) countEl.textContent = `${apps.length} app${apps.length !== 1 ? 's' : ''}`;

            if (!gridEl) return;

            if (!apps.length) {
                gridEl.innerHTML = '<div class="empty">No applications found.</div>';
                return;
            }

            gridEl.innerHTML = apps.map(cardMarkup).join('');
        }

        async function loadApps() {
            try {
                const res = await fetch('/data/page-metadata-registry.json');
                if (!res.ok) throw new Error(`Registry fetch failed: ${res.status}`);

                const registry = await res.json();

                const appsById = {};
                registry.pages
                    .filter(p => p.primary_section === 'applications' && p.status === 'active' && p.visibility === 'public')
                    .forEach(p => { appsById[p.id] = p; });

                CATEGORIES.forEach(cat => renderCategory(cat, appsById));

            } catch (err) {
                console.error(err);
                CATEGORIES.forEach(cat => {
                    const gridEl = document.getElementById(`${cat.id}-grid`);
                    if (gridEl) gridEl.innerHTML = '<div class="empty">Could not load applications.</div>';
                });
            }
        }

        loadApps();
    </script>
</body>
</html>
