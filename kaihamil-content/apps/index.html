<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kai Hamil Applications</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #17332f;
            --muted: #5d716b;
            --line: rgba(22, 56, 49, 0.12);
            --card: #ffffff;
            --shadow: 0 8px 32px rgba(23, 51, 47, 0.08);
            
            /* Category colors */
            --lifestyle: #5f7f4b;
            --lifestyle-bg: #f4f7f2;
            --systems: #1B4D4A;
            --systems-bg: #f0f4f4;
            --trips: #bf7540;
            --trips-bg: #faf6f2;
            --utilities: #4a5568;
            --utilities-bg: #f4f5f7;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            background: #ffffff;
            min-height: 100vh;
        }

        a { color: inherit; text-decoration: none; }

        /* Header */
        .site-header {
            padding: 24px 40px;
            border-bottom: 1px solid var(--line);
            background: #fff;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
        }

        .brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            letter-spacing: 0.03em;
        }

        .brand span { color: var(--systems); }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-link {
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: #fafafa;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .nav-link.active {
            color: white;
            background: var(--systems);
            border-color: var(--systems);
        }

        /* Page header */
        .page-header {
            text-align: center;
            padding: 48px 24px 32px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.4rem, 5vw, 3.6rem);
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        .page-header p {
            margin: 0;
            color: var(--muted);
            font-size: 1.05rem;
        }

        /* Filter nav */
        .filter-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 0 24px 32px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: #fff;
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover { transform: translateY(-1px); }
        .filter-btn.active { color: white; }

        .filter-btn[data-cat="lifestyle"] { color: var(--lifestyle); border-color: var(--lifestyle); }
        .filter-btn[data-cat="lifestyle"].active { background: var(--lifestyle); }
        .filter-btn[data-cat="systems"] { color: var(--systems); border-color: var(--systems); }
        .filter-btn[data-cat="systems"].active { background: var(--systems); }
        .filter-btn[data-cat="trips"] { color: var(--trips); border-color: var(--trips); }
        .filter-btn[data-cat="trips"].active { background: var(--trips); }
        .filter-btn[data-cat="utilities"] { color: var(--utilities); border-color: var(--utilities); }
        .filter-btn[data-cat="utilities"].active { background: var(--utilities); }
        .filter-btn[data-cat="all"] { color: var(--muted); }
        .filter-btn[data-cat="all"].active { background: var(--ink); color: white; border-color: var(--ink); }

        /* Category sections */
        .cat-section {
            padding: 48px 40px;
        }

        .cat-section.lifestyle { background: var(--lifestyle-bg); }
        .cat-section.systems { background: var(--systems-bg); }
        .cat-section.trips { background: var(--trips-bg); }
        .cat-section.utilities { background: var(--utilities-bg); }

        .cat-section.hidden { display: none; }

        .cat-inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        .cat-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 24px;
        }

        .cat-title {
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.9rem;
            font-weight: 500;
        }

        .cat-section.lifestyle .cat-title { color: var(--lifestyle); }
        .cat-section.systems .cat-title { color: var(--systems); }
        .cat-section.trips .cat-title { color: var(--trips); }
        .cat-section.utilities .cat-title { color: var(--utilities); }

        .cat-count {
            font-size: 0.85rem;
            color: var(--muted);
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Cards */
        .card {
            display: flex;
            flex-direction: column;
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 48px rgba(23, 51, 47, 0.12);
        }

        .card-visual {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* App-specific visuals */
        .visual-groove-pal {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        .visual-groove-pal::before {
            content: '◐';
            font-size: 3.5rem;
            color: #e8d5a3;
        }

        .visual-azores {
            background: linear-gradient(135deg, #2d6f73 0%, #1B4D4A 50%, #bf7540 100%);
            position: relative;
        }
        .visual-azores::before {
            content: 'AZORES';
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.9);
        }

        .visual-dude-trip {
            background: linear-gradient(135deg, #4a7c59 0%, #8fbc8f 50%, #d4a574 100%);
            position: relative;
        }
        .visual-dude-trip::before {
            content: 'DUDE';
            font-family: 'Inter', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            color: #fff;
            text-shadow: 2px 2px 0 #4a7c59;
        }

        .visual-vale {
            background: linear-gradient(135deg, #1B4D4A 0%, #2d6f73 100%);
        }
        .visual-vale::before {
            content: '//';
            font-size: 2.5rem;
            color: rgba(255,255,255,0.9);
            font-weight: 300;
            letter-spacing: 0.1em;
        }

        .visual-time-focus {
            background: linear-gradient(135deg, #5f7f4b 0%, #7a9f6a 100%);
        }
        .visual-time-focus::before {
            content: '◷';
            font-size: 3rem;
            color: rgba(255,255,255,0.9);
        }

        .visual-whos-making-dinner {
            background: linear-gradient(135deg, #bf7540 0%, #d4924f 100%);
        }
        .visual-whos-making-dinner::before {
            content: '⌂';
            font-size: 3rem;
            color: rgba(255,255,255,0.9);
        }

        .visual-whisky {
            background: linear-gradient(135deg, #6b4423 0%, #8b5a2b 100%);
        }
        .visual-whisky::before {
            content: '⚗';
            font-size: 3rem;
            color: rgba(255,255,255,0.9);
        }

        .visual-gatefield {
            background: linear-gradient(135deg, #4a5568 0%, #718096 100%);
        }
        .visual-gatefield::before {
            content: '⌂⌂';
            font-size: 2rem;
            color: rgba(255,255,255,0.9);
            letter-spacing: 0.2em;
        }

        .visual-daily-brief {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
        }
        .visual-daily-brief::before {
            content: '☀';
            font-size: 3rem;
            color: rgba(255,255,255,0.9);
        }

        .visual-script-reader {
            background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
        }
        .visual-script-reader::before {
            content: '▶';
            font-size: 3rem;
            color: rgba(255,255,255,0.9);
        }

        .visual-control-chart {
            background: linear-gradient(135deg, #4a5568 0%, #5a6578 100%);
        }
        .visual-control-chart::before {
            content: '◫';
            font-size: 3rem;
            color: rgba(255,255,255,0.9);
        }

        .visual-photo-flow {
            background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
        }
        .visual-photo-flow::before {
            content: '◫';
            font-size: 3rem;
            color: rgba(255,255,255,0.9);
        }

        .visual-couples-vale {
            background: linear-gradient(135deg, #8b4557 0%, #a65d6e 100%);
        }
        .visual-couples-vale::before {
            content: '♥';
            font-size: 2.5rem;
            color: rgba(255,255,255,0.9);
        }

        .card-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            margin: 0 0 8px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .card-desc {
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.55;
            flex: 1;
        }

        .card-meta {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .card-tag {
            padding: 4px 10px;
            border-radius: 999px;
            background: #f5f5f5;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .card-action {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
        }

        .card-link {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--systems);
        }

        .card-link:hover { text-decoration: underline; }

        .empty {
            padding: 40px;
            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
        }

        /* Footer */
        .footer {
            padding: 32px 40px;
            text-align: center;
            color: var(--muted);
            font-size: 0.88rem;
            border-top: 1px solid var(--line);
        }

        @media (max-width: 640px) {
            .site-header { padding: 20px 24px; }
            .cat-section { padding: 36px 24px; }
            .grid { grid-template-columns: 1fr; }
            .filter-nav { padding: 0 16px 24px; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="/">kai <span>hamil</span></a>
            <nav class="nav-links">
                <a class="nav-link" href="https://content.kaihamil.com/">Content</a>
                <a class="nav-link" href="/trips/">Trips</a>
                <a class="nav-link active" href="/apps/">Applications</a>
            </nav>
        </div>
    </header>

    <div class="page-header">
        <h1>Applications</h1>
        <p>Things that you can open and use.</p>
    </div>

    <nav class="filter-nav">
        <button class="filter-btn active" data-cat="all">All</button>
        <button class="filter-btn" data-cat="lifestyle">Lifestyle</button>
        <button class="filter-btn" data-cat="systems">Systems</button>
        <button class="filter-btn" data-cat="trips">Trips</button>
        <button class="filter-btn" data-cat="utilities">Utilities</button>
    </nav>

    <section class="cat-section lifestyle" id="lifestyle">
        <div class="cat-inner">
            <div class="cat-header">
                <h2 class="cat-title">Lifestyle</h2>
                <span class="cat-count" id="lifestyle-count"></span>
            </div>
            <div id="lifestyle-grid" class="grid">
                <div class="empty">Loading...</div>
            </div>
        </div>
    </section>

    <section class="cat-section systems" id="systems">
        <div class="cat-inner">
            <div class="cat-header">
                <h2 class="cat-title">Systems</h2>
                <span class="cat-count" id="systems-count"></span>
            </div>
            <div id="systems-grid" class="grid">
                <div class="empty">Loading...</div>
            </div>
        </div>
    </section>

    <section class="cat-section trips" id="trips">
        <div class="cat-inner">
            <div class="cat-header">
                <h2 class="cat-title">Trips</h2>
                <span class="cat-count" id="trips-count"></span>
            </div>
            <div id="trips-grid" class="grid">
                <div class="empty">Loading...</div>
            </div>
        </div>
    </section>

    <section class="cat-section utilities" id="utilities">
        <div class="cat-inner">
            <div class="cat-header">
                <h2 class="cat-title">Utilities</h2>
                <span class="cat-count" id="utilities-count"></span>
            </div>
            <div id="utilities-grid" class="grid">
                <div class="empty">Loading...</div>
            </div>
        </div>
    </section>

    <footer class="footer">
        kai hamil applications
    </footer>

    <script>
        const CATEGORIES = [
            { id: 'lifestyle', label: 'Lifestyle', ids: ['time-focus-app', 'gatefield-hoa', 'whos-making-dinner', 'groove-pal', 'whisky-cellar'] },
            { id: 'systems', label: 'Systems', ids: ['vale-os', 'vale-pro', 'couples-vale'] },
            { id: 'trips', label: 'Trips', ids: ['azores-15-year-app', 'dude-trip-26'] },
            { id: 'utilities', label: 'Utilities', ids: ['daily-brief', 'script-reader', 'control-chart-evaluator', 'photo-flow'] }
        ];

        const APP_COPY = {
            'time-focus-app': 'An operating tool for managing where attention goes over time.',
            'control-chart-evaluator': 'Evaluate process signals and variation without leaving the browser.',
            'script-reader': 'A stripped-back teleprompter surface for recording and rehearsal.',
            'whos-making-dinner': 'A household dinner planner that turns the 5 PM question into a calmer execution plan.',
            'vale-os': 'Strategic navigation software for goals, decisions, and life systems.',
            'vale-pro': 'A professional-facing Valé surface for work and client operations.',
            'couples-vale': 'A shared operating system for relationships, family coordination, and alignment.',
            'daily-brief': 'A daily briefing surface that packages the day into one launchable dashboard.',
            'groove-pal': 'A music-centered consumer app built on vinyl, trust, and analog patience.',
            'whisky-cellar': 'A private collection app for bottles, tasting notes, and cellar memory.',
            'gatefield-hoa': 'A purpose-built neighborhood operations and communication surface.',
            'photo-flow': 'A workflow app for reviewing, classifying, and organizing visual media.',
            'azores-15-year-app': 'A trip execution app that turns travel planning into a day-of operational surface.',
            'dude-trip-26': 'A packaged group trip application rather than a simple itinerary page.'
        };

        const VISUAL_MAP = {
            'groove-pal': 'visual-groove-pal',
            'azores-15-year-app': 'visual-azores',
            'dude-trip-26': 'visual-dude-trip',
            'vale-os': 'visual-vale',
            'vale-pro': 'visual-vale',
            'couples-vale': 'visual-couples-vale',
            'time-focus-app': 'visual-time-focus',
            'whos-making-dinner': 'visual-whos-making-dinner',
            'whisky-cellar': 'visual-whisky',
            'gatefield-hoa': 'visual-gatefield',
            'daily-brief': 'visual-daily-brief',
            'script-reader': 'visual-script-reader',
            'control-chart-evaluator': 'visual-control-chart',
            'photo-flow': 'visual-photo-flow'
        };

        const TAG_LABELS = {
            'trip-app': 'Trip app', 'travel': 'Travel', 'assistant': 'Assistant',
            'dashboard': 'Dashboard', 'workflow': 'Workflow', 'utility': 'Utility',
            'consumer': 'Consumer', 'family': 'Family', 'dinner': 'Dinner',
            'household': 'Household', 'operations': 'Ops', 'video': 'Video',
            'collection': 'Collection', 'media': 'Media', 'work': 'Work',
            'daily': 'Daily', 'music': 'Music', 'community': 'Community',
            'attention': 'Attention', 'time': 'Time', 'os': 'OS',
            'professional': 'Pro', 'personal': 'Personal', 'briefing': 'Briefing',
            'teleprompter': 'Teleprompter', 'photo': 'Photo', 'statistics': 'Stats',
            'group': 'Group', 'brand': 'Brand', 'azores': 'Azores'
        };

        function esc(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function cardMarkup(app) {
            const href = app.launch_url || app.url;
            const desc = APP_COPY[app.id] || app.description || '';
            const visualClass = VISUAL_MAP[app.id] || 'visual-vale';
            const tags = (app.tags || [])
                .filter(t => !['index', 'legacy', 'transitional', 'azores'].includes(t))
                .slice(0, 2)
                .map(t => `<span class="card-tag">${esc(TAG_LABELS[t] || t)}</span>`)
                .join('');

            return `
                <article class="card">
                    <div class="card-visual ${visualClass}"></div>
                    <div class="card-body">
                        <h3 class="card-title">${esc(app.title)}</h3>
                        <p class="card-desc">${esc(desc)}</p>
                        ${tags ? `<div class="card-meta">${tags}</div>` : ''}
                        <div class="card-action">
                            <a class="card-link" href="${esc(href)}">Open app →</a>
                        </div>
                    </div>
                </article>
            `;
        }

        function renderCategory(cat, appsById) {
            const apps = cat.ids.map(id => appsById[id]).filter(Boolean);
            const countEl = document.getElementById(`${cat.id}-count`);
            const gridEl = document.getElementById(`${cat.id}-grid`);
            if (countEl) countEl.textContent = `${apps.length} app${apps.length !== 1 ? 's' : ''}`;
            if (gridEl) gridEl.innerHTML = apps.length ? apps.map(cardMarkup).join('') : '<div class="empty">No applications found.</div>';
        }

        function filterCategories(cat) {
            document.querySelectorAll('.cat-section').forEach(section => {
                section.classList.toggle('hidden', cat !== 'all' && !section.classList.contains(cat));
            });
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.cat === cat);
            });
        }

        async function loadApps() {
            try {
                const res = await fetch('/data/page-metadata-registry.json');
                if (!res.ok) throw new Error(`Registry fetch failed: ${res.status}`);
                const registry = await res.json();
                const appsById = {};
                registry.pages
                    .filter(p => p.primary_section === 'applications' && p.status === 'active' && p.visibility === 'public')
                    .forEach(p => appsById[p.id] = p);
                CATEGORIES.forEach(cat => renderCategory(cat, appsById));
            } catch (err) {
                console.error(err);
                document.querySelectorAll('.grid').forEach(g => g.innerHTML = '<div class="empty">Could not load applications.</div>');
            }
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => filterCategories(btn.dataset.cat));
        });

        loadApps();
    </script>
</body>
</html>
